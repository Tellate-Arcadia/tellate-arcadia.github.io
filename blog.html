  <div class="wrap">

  </div>
</section>

<script src="assets/posts-data.js"></script>
<script>
  const grid = document.getElementById('post-grid');
  grid.innerHTML = BLOG_POSTS.map(post => `
    <a class="post-card" href="posts/${post.id}.html" style="text-decoration:none; color:inherit;">
      <span class="post-date">${post.date}</span>
      <div>
        <span class="post-cat">${post.category}</span>
        <h2>${post.title}</h2>
        <p>${post.excerpt}</p>
      </div>
    </a>
  `).join('');
</script>
